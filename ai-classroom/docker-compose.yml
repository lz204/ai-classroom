services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - LLM_API_KEY=${LLM_API_KEY}
      # 默认阿里百炼（DashScope）OpenAI 兼容模式；真实 Key 放在项目根 .env，勿写入本文件
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      # 容器内实际读取 /app/knowledge_base/faiss_index（纯英文路径，规避 faiss C 层不支持中文目录）；
      # 该索引必须先在宿主机构建：
      #   cd backend && python rag/ingest.py --path ../knowledge_base --output ../knowledge_base/faiss_index
      # HuggingFace 下载端点（国内网络加速）：容器内首次检索需下载 bge-large-zh 约 1.2GB
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - VECTOR_INDEX_PATH=knowledge_base/faiss_index
    volumes:
      # 知识库与向量索引挂载到容器，方便宿主机更新
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
